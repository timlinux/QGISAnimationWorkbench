name: Build Plugin Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-package:
    name: Build Plugin Zip
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:release-3_34

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Python command
        run: apt-get update && apt-get install -y python-is-python3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate plugin zip
        run: python admin.py generate-zip

      - name: Get zip details
        id: zip-details
        run: |
          ZIP_NAME=$(ls dist)
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=dist/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip-details.outputs.ZIP_NAME }}
          path: ${{ steps.zip-details.outputs.ZIP_PATH }}
          retention-days: 30
